name: AniList Lite ARMv7 experimental
on:
  push:
    branches: [feature/anilist-tv-armv7]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish verified experimental pre-release (requires configured OAuth client)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: anilist-armv7-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify original Lite preservation
        run: python3 scripts/anilist/verify_preservation.py --output preservation.json
      - name: Python tests
        run: PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -v
      - name: Static phone callback tests
        run: node scripts/anilist/test_callback.mjs
      - name: Lite unit tests
        run: >-
          ./gradlew :app:testLiteDebugUnitTest -PanilistArmv7Only=true --stacktrace
          -Pkotlin.compiler.execution.strategy=in-process --max-workers=2
          "-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anilist-test-evidence
          path: |
            app/build/reports/tests/
            app/build/test-results/
            preservation.json
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore upstream configuration and signing
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in LOCAL_PROPERTIES_BASE64 KEYSTORE_BASE64 NUVIO_RELEASE_KEY_ALIAS NUVIO_RELEASE_KEY_PASSWORD NUVIO_RELEASE_STORE_PASSWORD; do
            test -n "${!name}" || { echo "Missing repository secret: $name" >&2; exit 1; }
          done
          umask 077
          printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/anilist-release.jks"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/anilist-release.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=$NUVIO_RELEASE_KEY_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$NUVIO_RELEASE_KEY_PASSWORD"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$NUVIO_RELEASE_STORE_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Verify public configuration and original Supabase endpoint
        run: python3 scripts/anilist/verify_release_config.py --online
      - name: Require verified OAuth registration and physical pairing
        env:
          ANILIST_TV_OAUTH_VERIFIED: ${{ vars.ANILIST_TV_OAUTH_VERIFIED }}
        run: |
          test "$ANILIST_TV_OAUTH_VERIFIED" = "true" || { echo 'Register and test the TV OAuth client/callback, then set ANILIST_TV_OAUTH_VERIFIED=true.' >&2; exit 1; }
      - name: Test and build only Lite ARMv7
        run: >-
          ./gradlew :app:testLiteReleaseUnitTest :app:assembleLiteRelease -PanilistArmv7Only=true --stacktrace
          -Pkotlin.compiler.execution.strategy=in-process --max-workers=2
          "-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
      - name: Verify single APK and prepare pre-release
        env:
          EXPECTED_SIGNER_SHA256: ${{ vars.NUVIO_EXPECTED_SIGNER_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/lite/release -maxdepth 1 -name '*.apk')
          test "${#apks[@]}" -eq 1
          mkdir -p delivery
          apk=delivery/NuvioTV-Lite-2.3.2-anilist.1-armeabi-v7a.apk
          cp "${apks[0]}" "$apk"
          args=()
          if [ -n "$EXPECTED_SIGNER_SHA256" ]; then args+=(--expected-signer "$EXPECTED_SIGNER_SHA256"); fi
          python3 scripts/anilist/verify_apk.py "$apk" "${args[@]}" --output delivery/apk-verification.json
          cp validation/anilist-release-notes.md delivery/RELEASE_NOTES.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('delivery/apk-verification.json').read_text())
          with Path('delivery/RELEASE_NOTES.md').open('a') as notes:
              notes.write('\nSHA-256: `'+report['sha256']+'`\n')
              notes.write('\nCertificado SHA-256: `'+report['signer_sha256']+'`\n')
              notes.write('\nActualización sobre instalación previa: '+('certificado esperado verificado; requiere versionCode instalado inferior.' if report['update_certificate_verified'] else 'no verificada; no se dispone del certificado de la instalación anterior.')+'\n')
          PY
      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: anilist-lite-armv7
          path: delivery/
      - name: Publish experimental pre-release with only ARMv7 APK
        run: gh release create v2.3.2-anilist.1 --target "$GITHUB_SHA" --prerelease --title 'NuvioTV Lite + AniList — experimental ARMv7' --notes-file delivery/RELEASE_NOTES.md delivery/*.apk
      - name: Remove restored credentials
        if: always()
        run: rm -f local.properties "$RUNNER_TEMP/anilist-release.jks"
