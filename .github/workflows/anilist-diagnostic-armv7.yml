name: Lite ARMv7 diagnostic APK (debug signed)
on:
  push:
    branches: [feature/anilist-tv-armv7]
    paths: ['.github/workflows/anilist-diagnostic-armv7.yml']
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish the verified debug-signed APK as an experimental pre-release
        type: boolean
        default: false
      tag:
        description: Pre-release tag
        type: string
        default: v0.1.0-anilist
permissions:
  contents: read
concurrency:
  group: anilist-diagnostic-armv7-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CI_USE_DEBUG_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Verify original players, authentication and QR sources
        run: python3 scripts/anilist/verify_preservation.py --output preservation.json
      - name: Download pinned official Lite ARMv7 reference
        run: |
          mkdir -p reference
          gh release download v2.3.1-lite --repo hackerslash/NuvioTV-Lite --pattern app-lite-armeabi-v7a-release.apk --dir reference
      - name: Restore public configuration through the upstream mechanism
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          fi
          python3 scripts/anilist/prepare_diagnostic_config.py reference/app-lite-armeabi-v7a-release.apk --output diagnostic-config.json
      - name: Prepare Android debug signing only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
          signer="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)"
          echo "DIAGNOSTIC_SIGNER_SHA256=$signer" >> "$GITHUB_ENV"
      - name: Python and phone callback tests
        run: |
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -v
          node scripts/anilist/test_callback.mjs
      - name: Test and build only diagnostic Lite ARMv7
        run: >-
          ./gradlew :app:testLiteReleaseUnitTest :app:assembleLiteRelease
          -PanilistArmv7Only=true -PanilistDiagnostic=true
          -Pkotlin.compiler.execution.strategy=in-process --max-workers=2
          "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
          --stacktrace
      - name: Verify APK, debug certificate, public config and original native bytes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/lite/release -maxdepth 1 -name '*.apk')
          test "${#apks[@]}" -eq 1
          mkdir -p delivery
          apk=delivery/NuvioTV-Lite-2.3.2-anilist.1-experimental-debug-signed-armeabi-v7a.apk
          cp "${apks[0]}" "$apk"
          python3 scripts/anilist/verify_apk.py "$apk" --diagnostic --expected-signer "$DIAGNOSTIC_SIGNER_SHA256" --reference-apk reference/app-lite-armeabi-v7a-release.apk --build-config app/build/generated/source/buildConfig/lite/release/com/nuvio/tv/BuildConfig.java --output delivery/apk-verification.json
          sha256sum "$apk" > delivery/SHA256SUMS.txt
          cp diagnostic-config.json preservation.json delivery/
          cp validation/diagnostic-apk-instructions.md delivery/README.md
          cp -R app/build/test-results/testLiteReleaseUnitTest delivery/test-results
      - name: Upload verified experimental APK and evidence (no release)
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-Lite-ARMv7-EXPERIMENTAL-DEBUG-SIGNED
          path: delivery/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-failure-evidence
          path: |
            app/build/test-results/
            app/build/reports/tests/
            diagnostic-config.json
            preservation.json
            app/build/outputs/logs/
      - name: Remove local configuration and debug key
        if: always()
        run: rm -f local.properties "$HOME/.android/debug.keystore"
  prerelease:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_prerelease
    needs: diagnostic
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NuvioTV-Lite-ARMv7-EXPERIMENTAL-DEBUG-SIGNED
          path: delivery
      - name: Publish experimental pre-release with only the ARMv7 APK
        shell: bash
        run: |
          set -euo pipefail
          (cd delivery && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('delivery/apk-verification.json').read_text())
          assert r['abi'] == 'armeabi-v7a' and r['native_payload_identical_to_original']
          notes = Path('validation/anilist-release-notes.md').read_text()
          notes += '\n## Verificación de este APK\n\n'
          notes += f"- Archivo: `{r['apk']}`\n- SHA-256: `{r['sha256']}`\n"
          notes += f"- Package: `{r['package']}` · versionCode {r['version_code']} · versionName `{r['version_name']}`\n"
          notes += f"- ABI: `{r['abi']}` únicamente · bibliotecas nativas idénticas byte a byte a la release oficial v2.3.1-lite ARMv7\n"
          notes += f"- Firma: Android Debug (generada en el runner), certificado SHA-256 `{r['signer_sha256']}`\n"
          notes += f"- AniList: Client ID `{r['anilist_client_id']}`, redirect `{r['anilist_redirect_uri']}`\n"
          Path('delivery/RELEASE_NOTES.md').write_text(notes)
          PY
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
            --title "NuvioTV Lite + AniList — ${TAG} (experimental ARMv7, firma debug)" \
            --notes-file delivery/RELEASE_NOTES.md delivery/*.apk delivery/SHA256SUMS.txt
