name: Lite ARMv7 diagnostic APK (debug signed)
on:
  push:
    branches: [feature/anilist-tv-armv7]
    paths: ['.github/workflows/anilist-diagnostic-armv7.yml']
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish the verified debug-signed APK as an experimental pre-release
        type: boolean
        default: false
      tag:
        description: Pre-release tag
        type: string
        default: v0.1.0-anilist
      from_run_id:
        description: Publish the verified artifact of this earlier run instead of rebuilding
        type: string
        default: ''
      standalone:
        description: Build NuvioTvOG (com.eibyx.nuviotvog), which installs beside the original Lite
        type: boolean
        default: false
      release_target:
        description: Commit to tag instead of the build commit; it may differ from it only under .github/
        type: string
        default: ''
      resign_after_build:
        description: NuvioTvOG gets its fixed signature outside CI (version label without debug-signed)
        type: boolean
        default: false
      prerelease:
        description: Mark the GitHub release as a pre-release (untick for a normal release)
        type: boolean
        default: true
      resigned_apk_ref:
        description: Branch holding the verified APK re-signed with the fixed NuvioTvOG key (optional)
        type: string
        default: ''
      resigned_apk_path:
        description: Path of that APK inside the branch
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: anilist-diagnostic-armv7-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostic:
    if: github.event_name != 'workflow_dispatch' || inputs.from_run_id == ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      STANDALONE: ${{ github.event_name == 'workflow_dispatch' && inputs.standalone && 'true' || 'false' }}
      RESIGN_AFTER_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.resign_after_build && 'true' || 'false' }}
      # AGP resolves its debug keystore from ANDROID_USER_HOME first; pin it to the key fingerprinted below.
      ANDROID_USER_HOME: /home/runner/.android
      # Public certificate of the fixed NuvioTvOG key; its keystore lives only in repository secrets.
      NUVIOTVOG_SIGNER_SHA256: 09778027af6ff49b4e3393f1e786d8b65040abe25c148c3ed0724c7abfc76ceb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Verify original players, authentication and QR sources
        run: python3 scripts/anilist/verify_preservation.py --output preservation.json
      - name: Download pinned official Lite ARMv7 reference
        run: |
          mkdir -p reference
          gh release download v2.4.0-lite --repo hackerslash/NuvioTV-Lite --pattern app-lite-armeabi-v7a-release.apk --dir reference
      - name: Restore public configuration through the upstream mechanism
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          fi
          python3 scripts/anilist/prepare_diagnostic_config.py reference/app-lite-armeabi-v7a-release.apk --output diagnostic-config.json
      - name: Prepare signing (fixed NuvioTvOG key when configured, otherwise Android debug)
        shell: bash
        env:
          NUVIOTVOG_KEYSTORE_BASE64: ${{ secrets.NUVIOTVOG_KEYSTORE_BASE64 }}
          NUVIOTVOG_KEYSTORE_PASSWORD: ${{ secrets.NUVIOTVOG_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$STANDALONE" = true ] && [ -n "$NUVIOTVOG_KEYSTORE_BASE64" ]; then
            # Same key for every NuvioTvOG build, so new versions install over the previous one.
            test -n "$NUVIOTVOG_KEYSTORE_PASSWORD" || { echo 'Missing secret NUVIOTVOG_KEYSTORE_PASSWORD' >&2; exit 1; }
            umask 077
            keystore="$RUNNER_TEMP/nuviotvog.p12"
            printf '%s' "$NUVIOTVOG_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$keystore"
            signer="$(keytool -exportcert -keystore "$keystore" -storepass "$NUVIOTVOG_KEYSTORE_PASSWORD" -alias nuviotvog | sha256sum | cut -d ' ' -f 1)"
            test "$signer" = "$NUVIOTVOG_SIGNER_SHA256" || { echo 'NUVIOTVOG_KEYSTORE_BASE64 is not the NuvioTvOG key' >&2; exit 1; }
            {
              echo "CI_USE_DEBUG_SIGNING=false"
              echo "SIGNING_KIND=fixed"
              echo "NUVIO_RELEASE_STORE_FILE=$keystore"
              echo "NUVIO_RELEASE_KEY_ALIAS=nuviotvog"
              echo "NUVIO_RELEASE_KEY_PASSWORD=$NUVIOTVOG_KEYSTORE_PASSWORD"
              echo "NUVIO_RELEASE_STORE_PASSWORD=$NUVIOTVOG_KEYSTORE_PASSWORD"
              echo "DIAGNOSTIC_SIGNER_SHA256=$signer"
            } >> "$GITHUB_ENV"
            exit 0
          fi
          { echo "CI_USE_DEBUG_SIGNING=true"; echo "SIGNING_KIND=debug"; } >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_USER_HOME"
          if [ ! -f "$ANDROID_USER_HOME/debug.keystore" ]; then
            keytool -genkeypair -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
          signer="$(keytool -exportcert -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)"
          echo "DIAGNOSTIC_SIGNER_SHA256=$signer" >> "$GITHUB_ENV"
      - name: Python and phone callback tests
        run: |
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -v
          node scripts/anilist/test_callback.mjs
      # Separate invocations: upstream wall-clock tests (debounces, timeouts) must not compete with R8.
      - name: Lite release unit tests
        run: >-
          ./gradlew :app:testLiteReleaseUnitTest
          -PanilistArmv7Only=true -PanilistDiagnostic=true -PanilistStandalone=${{ env.STANDALONE }}
          -PanilistFixedSigning=${{ env.SIGNING_KIND == 'fixed' || env.RESIGN_AFTER_BUILD == 'true' }}
          -Pkotlin.compiler.execution.strategy=in-process --max-workers=2
          "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
          --stacktrace
      - name: Build only Lite ARMv7
        run: >-
          ./gradlew :app:assembleLiteRelease
          -PanilistArmv7Only=true -PanilistDiagnostic=true -PanilistStandalone=${{ env.STANDALONE }}
          -PanilistFixedSigning=${{ env.SIGNING_KIND == 'fixed' || env.RESIGN_AFTER_BUILD == 'true' }}
          -Pkotlin.compiler.execution.strategy=in-process --max-workers=2
          "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
          --stacktrace
      - name: Verify APK, debug certificate, public config and original native bytes
        shell: bash
        run: |
          set -euo pipefail
          # Evidence only: which debug keystores exist after the build (paths, no key material).
          find "$HOME" /usr/local/lib/android -name debug.keystore 2>/dev/null || true
          mapfile -t apks < <(find app/build/outputs/apk/lite/release -maxdepth 1 -name '*.apk')
          test "${#apks[@]}" -eq 1
          mkdir -p delivery
          extra=()
          if [ "$STANDALONE" = true ] && [ "$SIGNING_KIND" = fixed ]; then
            apk=delivery/NuvioTvOG-0.6.1-armeabi-v7a.apk
            extra+=(--standalone --fixed-signing)
          elif [ "$STANDALONE" = true ] && [ "$RESIGN_AFTER_BUILD" = true ]; then
            # Debug-signed here only until the fixed NuvioTvOG key replaces the signature.
            apk=delivery/NuvioTvOG-0.6.1-armeabi-v7a.apk
            extra+=(--standalone --pending-resign)
          elif [ "$STANDALONE" = true ]; then
            apk=delivery/NuvioTvOG-0.6.1-debug-signed-armeabi-v7a.apk
            extra+=(--standalone)
          else
            apk=delivery/NuvioTV-Lite-2.3.2-anilist.1-experimental-debug-signed-armeabi-v7a.apk
          fi
          cp "${apks[0]}" "$apk"
          python3 scripts/anilist/verify_apk.py "$apk" "${extra[@]}" --diagnostic --expected-signer "$DIAGNOSTIC_SIGNER_SHA256" --reference-apk reference/app-lite-armeabi-v7a-release.apk --build-config app/build/generated/source/buildConfig/lite/release/com/nuvio/tv/BuildConfig.java --output delivery/apk-verification.json
          sha256sum "$apk" > delivery/SHA256SUMS.txt
          cp diagnostic-config.json preservation.json delivery/
          cp validation/diagnostic-apk-instructions.md delivery/README.md
          cp -R app/build/test-results/testLiteReleaseUnitTest delivery/test-results
      - name: Upload verified experimental APK and evidence (no release)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STANDALONE == 'true' && 'NuvioTvOG-ARMv7-DEBUG-SIGNED' || 'NuvioTV-Lite-ARMv7-EXPERIMENTAL-DEBUG-SIGNED' }}
          path: delivery/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-failure-evidence
          path: |
            app/build/test-results/
            app/build/reports/tests/
            diagnostic-config.json
            preservation.json
            app/build/outputs/logs/
      - name: Remove local configuration and signing keys
        if: always()
        run: rm -f local.properties "$ANDROID_USER_HOME/debug.keystore" "$RUNNER_TEMP/nuviotvog.p12"
  prerelease:
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.publish_prerelease &&
      (needs.diagnostic.result == 'success' || (needs.diagnostic.result == 'skipped' && inputs.from_run_id != ''))
    needs: diagnostic
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      FROM_RUN_ID: ${{ inputs.from_run_id }}
      STANDALONE: ${{ inputs.standalone && 'true' || 'false' }}
      RELEASE_TARGET: ${{ inputs.release_target }}
      PRERELEASE: ${{ inputs.prerelease && 'true' || 'false' }}
      RESIGNED_APK_REF: ${{ inputs.resigned_apk_ref }}
      RESIGNED_APK_PATH: ${{ inputs.resigned_apk_path }}
      NUVIOTVOG_SIGNER_SHA256: 09778027af6ff49b4e3393f1e786d8b65040abe25c148c3ed0724c7abfc76ceb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.standalone && 'NuvioTvOG-ARMv7-DEBUG-SIGNED' || 'NuvioTV-Lite-ARMv7-EXPERIMENTAL-DEBUG-SIGNED' }}
          path: delivery
          run-id: ${{ inputs.from_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Use the verified APK re-signed with the fixed NuvioTvOG key
        if: inputs.resigned_apk_ref != ''
        shell: bash
        run: |
          set -euo pipefail
          test "$STANDALONE" = true -a -n "$RESIGNED_APK_PATH"
          sha256sum -c delivery/SHA256SUMS.txt
          git fetch --no-tags --depth=1 origin "refs/heads/$RESIGNED_APK_REF"
          resigned="$RUNNER_TEMP/$(basename "$RESIGNED_APK_PATH")"
          git cat-file blob "FETCH_HEAD:$RESIGNED_APK_PATH" > "$resigned"
          verified="$(ls delivery/*.apk)"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          report="$("$apksigner" verify --verbose --print-certs "$resigned")"
          python3 - "$verified" "$resigned" "$report" <<'PY'
          import hashlib, json, os, re, sys, zipfile
          from pathlib import Path
          verified, resigned, report = sys.argv[1:]
          def payload(path):
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None
                  return {i.filename: hashlib.sha256(z.read(i.filename)).hexdigest()
                          for i in z.infolist() if not i.filename.startswith('META-INF/')}
          # Only the signature may differ from the APK this workflow built and verified.
          assert payload(verified) == payload(resigned), 'Re-signed APK content differs from the verified build'
          signers = set(re.findall(r'certificate SHA-256 digest:\s*([0-9a-f]{64})', report))
          assert signers == {os.environ['NUVIOTVOG_SIGNER_SHA256']}, 'Re-signed APK is not signed with the NuvioTvOG key'
          dn = re.search(r'certificate DN:\s*(.+)', report).group(1)
          r = json.loads(Path('delivery/apk-verification.json').read_text())
          r.update(apk=Path(resigned).name, sha256=hashlib.sha256(Path(resigned).read_bytes()).hexdigest(),
                   signer_sha256=signers.pop(), signer_dn=dn, signing='fixed',
                   resigned_from_sha256=r['sha256'])
          Path('delivery/apk-verification.json').write_text(json.dumps(r, indent=2) + '\n')
          PY
          rm "$verified"
          cp "$resigned" delivery/
          sha256sum "delivery/$(basename "$resigned")" > delivery/SHA256SUMS.txt
          cat delivery/SHA256SUMS.txt
      - name: Publish experimental pre-release with only the ARMv7 APK
        shell: bash
        run: |
          set -euo pipefail
          # SHA256SUMS.txt lists paths relative to the repository root (delivery/...).
          sha256sum -c delivery/SHA256SUMS.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('delivery/apk-verification.json').read_text())
          import os
          assert r['abi'] == 'armeabi-v7a' and r['native_payload_identical_to_original']
          standalone = os.environ['STANDALONE'] == 'true'
          assert standalone == ('coexistence_with_original' in r), 'Artifact does not match the requested build kind'
          notes = Path('validation/anilist-standalone-release-notes.md' if standalone else 'validation/anilist-release-notes.md').read_text()
          notes += '\n## Verificación de este APK\n\n'
          notes += f"- Archivo: `{r['apk']}`\n- SHA-256: `{r['sha256']}`\n"
          notes += f"- Package: `{r['package']}` · versionCode {r['version_code']} · versionName `{r['version_name']}`\n"
          notes += f"- ABI: `{r['abi']}` únicamente · bibliotecas nativas precompiladas (MPV, FFmpeg, ExoPlayer, libass) idénticas byte a byte a la release oficial v2.4.0-lite ARMv7; `libdovi_bridge.so` compilada desde las fuentes sin cambios\n"
          if r.get('signing') == 'fixed':
              notes += f"- Firma: clave fija de NuvioTvOG, certificado SHA-256 `{r['signer_sha256']}`. Las próximas versiones se instalan encima de esta sin desinstalar.\n"
          else:
              notes += f"- Firma: Android Debug (generada en el runner), certificado SHA-256 `{r['signer_sha256']}`\n"
          notes += f"- AniList: Client ID `{r['anilist_client_id']}`, redirect `{r['anilist_redirect_uri']}`\n"
          if standalone:
              c = r['coexistence_with_original']
              notes += f"- Coexistencia con `{c['original_package']}` (APK oficial v2.4.0-lite): sin conflictos de package, authorities ({', '.join(c['standalone_authorities'])}) ni permisos personalizados; sin sharedUserId; sin actualizador integrado\n"
              notes += f"- Nombre visible: `{c['launcher_label']}`\n"
          Path('delivery/RELEASE_NOTES.md').write_text(notes)
          PY
          # Tag the commit the APK was actually built from.
          target="$GITHUB_SHA"
          if [ -n "$FROM_RUN_ID" ]; then
            target="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FROM_RUN_ID" --jq .head_sha)"
          fi
          # GITHUB_TOKEN may not create a tag on a commit that changes CI files. A release source
          # commit may restore .github/ from dev, but must carry exactly the build's other files.
          built="$target"
          if [ -n "$RELEASE_TARGET" ]; then
            git cat-file -e "$RELEASE_TARGET^{commit}"
            outside="$(git diff --name-only "$target" "$RELEASE_TARGET" -- . ':(exclude).github')"
            test -z "$outside" || { echo "Release target differs from the build outside .github/: $outside" >&2; exit 1; }
            echo "APK built from $target; tagging $RELEASE_TARGET (identical outside .github/)"
            target="$RELEASE_TARGET"
          fi
          if [ "$STANDALONE" = true ] && [ "$PRERELEASE" = false ]; then
            title="NuvioTvOG ${TAG} (ARMv7)"
          elif [ "$STANDALONE" = true ]; then
            title="NuvioTvOG — ${TAG} (app independiente, experimental ARMv7, firma debug)"
          else
            title="NuvioTV Lite + AniList — ${TAG} (experimental ARMv7, firma debug)"
          fi
          # GITHUB_TOKEN cannot create a tag on a commit that changes workflow files, so a tag or
          # release created beforehand by the owner is filled in instead of created.
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Never mix builds: refuse a release that already holds a different APK.
            other="$(gh release view "$TAG" --json assets --jq '.assets[].name' | grep '\.apk$' | grep -vxF "$(basename delivery/*.apk)" || true)"
            test -z "$other" || { echo "Release $TAG already contains another APK: $other" >&2; exit 1; }
            gh release edit "$TAG" --prerelease="$PRERELEASE" --draft=false --title "$title" --notes-file delivery/RELEASE_NOTES.md
            gh release upload "$TAG" --clobber delivery/*.apk delivery/SHA256SUMS.txt
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --prerelease="$PRERELEASE" --title "$title" \
              --notes-file delivery/RELEASE_NOTES.md delivery/*.apk delivery/SHA256SUMS.txt
          else
            gh release create "$TAG" --target "$target" --prerelease="$PRERELEASE" --title "$title" \
              --notes-file delivery/RELEASE_NOTES.md delivery/*.apk delivery/SHA256SUMS.txt
          fi
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          echo "Release $TAG points at $tagged (APK built from $built)"
